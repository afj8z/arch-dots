source = ~/.config/theme/out/hypr.conf


$bg = {{{{custom.mysurface}}}}
$abg = {{{{custom.mysurfacedim}}}}
$fg = {{{{custom.myfront}}}}
$cyan = {color2}
$blue = {color4}
$red = {color1}
$yllw = {color3}

$font = {{{{custom.monofont}}}}

general {{
    background_blur = true
    background = blur
    no_fade_in = false
    disable_loanding_bar = false
    grace = 0 
    hide_cursor = true
    ignore_empty_password = true
    immediate_redering = true
}}

input-field {{
    monitor =
    background = $clr.bg
    color = $blue
    size = 200, 60
    outline_thickness = 2
    dot_size = 0.30
    rounding = 0
    dots_spacing = true
    dots_center = true
    outer_color = $yllw
    inner_color = $bg
    font_color = $blue
    fade_on_empty = true
    placeholder_text = <i>Password: </i> # Text rendered in th>
    hide_input = false
    position = 0, 0
    halign = center
    valign = center
}}
