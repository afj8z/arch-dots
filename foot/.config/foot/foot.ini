font=JomeNFMono-Regular:size=18
font-bold=Iosevka Wide Hv XEx NF:size=18
font-italic=Iosevka Wide XEx It NF:size=18

underline-thickness=1.5
underline-offset=1
font-size-adjustment=0.25

include=~/.config/foot/foottheme.ini

[colors-dark]
alpha=1.0
alpha-mode=matching

[tweak]
font-monospace-warn=no
delayed-render-lower=1000000
delayed-render-upper=4500000

[key-bindings]
color-theme-toggle=Control+Shift+i

[text-bindings]
\x00\x62 = Mod4+b
\x00\x63 = Mod4+c
\x00\x65 = Mod4+e
\x00\x66 = Mod4+f
\x00\x67 = Mod4+g
\x00\x6a = Mod4+j
\x00\x6b = Mod4+k
\x00\x6c = Mod4+l
\x00\x6d = Mod4+m
\x00\x6e = Mod4+n
\x00\x6f = Mod4+o
\x00\x70 = Mod4+p
\x00\x73 = Mod4+s
\x00\x74 = Mod4+t
\x00\x76 = Mod4+v
\x00\x57 = Mod4+w
\x00\x78 = Mod4+x
\x1b\x20 = Shift+space

\x00\x4c = Mod4+L
\x00\x54 = Mod4+T

\x00\x2f = Mod4+slash
