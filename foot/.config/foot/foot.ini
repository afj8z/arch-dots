font=JomeNFMono-Regular:size=18
font-bold=JomeNFMono-Heavy:size=18
font-italic=JomeNFMono-Regular:size=18:style=Extra-Extended Italic,Italic

underline-thickness=1.5
underline-offset=1

font-size-adjustment=0.25

include=~/.config/foot/foottheme.ini

[colors-dark]
alpha=1.0
alpha-mode=matching

[tweak]
font-monospace-warn=no

[key-bindings]
color-theme-toggle=Control+Shift+i
