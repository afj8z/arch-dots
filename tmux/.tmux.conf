##### CORE KEYS ###############################################################
unbind C-b
set-option -g prefix C-SPACE
set-option -g prefix2 M-BSpace
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"
source-file "~/.config/tmux/tmux-theme.conf"
set -s extended-keys always
set -as terminal-features '*:extkeys'

##### TERMINAL SETTINGS #######################################################
set -g default-command /bin/zsh
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -as terminal-features 'tmux-256color:RGB'
set -ga terminal-overrides ",*:Tc"
set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on
set -g mouse on
setw -g mode-keys vi
set -g @floatwin "display-popup -E -w 70% -h 70% -x C -y C"
set -g @appwin "neww"

##### SESSION BEHAVIOR ########################################################
set -g base-index 1
setw -g pane-base-index 1
set -g detach-on-destroy off
set-option -g renumber-windows on
setw -g automatic-rename on
set -g remain-on-exit "off"

##### STYLE ###################################################################
set -g popup-border-lines "single"
set-window-option -g set-titles on

# STATUS LINE
set -g status-interval 5
set -g status-position top
set -g status-justify absolute-centre
set -g status-left-length 500
set -g status-left "#[italics,fg=color7]#S #(tmux ls | wc -l) #[fg=color3]#{?#{==:#{client_key_table},root},,#{client_key_table}}"
set -g window-status-format '#[italics,fg=color7] #I#{?window_last_flag,##, }#W '
set -g window-status-current-format '#[italics,fg=color15] #I#F#W #[default]'
setw -g window-status-separator ""
set -g status-right ""

##### KEYS ####################################################################
# COPY MODE
bind v copy-mode
# bind v run-shell "tm-copy-mode"
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe 'wl-copy'
bind-key -T copy-mode-vi Y send -X copy-pipe-end-of-line 'wl-copy'
## Bind Prefix + / to enter copy mode and immediately prompt for a forward search string
bind / copy-mode \; send-keys / \; send-keys -X search-forward

# PANE/WINDOW NAVIGATION 
bind W switch-client -T window
bind -T window -r h select-pane -L
bind -T window -r j select-pane -D
bind -T window -r k select-pane -U
bind -T window -r l select-pane -R
bind -T window -r H resize-pane -L
bind -T window -r J resize-pane -D
bind -T window -r K resize-pane -U
bind -T window -r L resize-pane -R
bind -T window s split-window
bind -T window v split-window -h
bind -T window c kill-pane

bind c kill-pane

bind b set status


# CUSTOM LAUNCHERS
## TMUX APPS IN SESSIONS
bind-key m run-shell "tmux #{@floatwin} -T ' #[fg=color4]Calculator ' -E 'tm-app-qalc  \"#S\"'"
set-hook -g session-closed "run-shell 'tmux -L qalc_daemon kill-session -t qalc_#{session_name} 2>/dev/null || true'"
bind-key e run-shell "tmux #{@floatwin} -T ' #[fg=color4]Explorer ' -E 'tm-app-expl \"#S\"'"
set-hook -g session-closed "run-shell 'tmux -L expl_daemon kill-session -t expl_#{session_name} 2>/dev/null || true'"

## TMUX PICKERS/ LAUNCHERS
bind-key o run-shell "tmux #{@appwin} tm-open-pdf"
bind-key q run-shell "tmux #{@appwin} nvim ~/documents/.questions.md"
bind-key G run-shell "tm-open-repoweb"
bind-key -r g display-popup -d "#{pane_current_path}" -w 100% -h 100% -T "#[fg=color4]lazygit" -E "lazygit" 

## TMUX SESSION NAVIGATION
bind-key s run-shell "tmux #{@appwin} tm-sess-switch"
bind-key f run-shell "tmux #{@appwin} tm-sess-new" 
bind-key 0 run-shell "tm-sess-new ~ home"
bind T new-window -c "#{pane_current_path}"
bind t neww

bind L run-shell "tmux switch-client -t $(tmux display-message -p #{client_last_session} 2>/dev/null) || tmux display-message 'No last session'"

bind l last-window
bind j previous-window
bind k next-window

set-hook -g client-session-changed 'run-shell "tmux refresh-client -S"'
set-hook -g session-created 'run-shell "tmux refresh-client -S"'
set-hook -g session-closed 'run-shell "tmux refresh-client -S"'
