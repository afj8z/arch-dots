##### CORE KEYS ###############################################################
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."
source-file "~/.config/tmux/tmux-theme.conf"
set -s extended-keys always
set -as terminal-features '*:extkeys'

##### TERMINAL SETTINGS #######################################################
set -g default-command /bin/zsh
set -sg escape-time 0
set -g default-terminal "tmux-256color"
# set -as terminal-features ',*:RGB'
set -ga terminal-overrides ",*:Tc"
set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on
set -g mouse on
setw -g mode-keys vi
set -g @floatopts "display-popup -E -w 100% -h 100% -x C -y C"
# set -g @floatopts "neww"

##### SESSION BEHAVIOR ########################################################
set -g base-index 1
setw -g pane-base-index 1
set -g detach-on-destroy off
set-option -g renumber-windows on
setw -g automatic-rename on

##### STYLE ###################################################################
set -g popup-border-lines "none"
set-hook -g pane-focus-out "select-pane -P 'fg=color7,bg=#{@BGDIM}'"
set-hook -g pane-focus-in 'select-pane -P bg=default,fg=default'
set-window-option -g set-titles on

# STATUS LINE
set -g status-interval 5
set -g status-position top
set -g status-justify left
## LEFT: Window list
set -g status-left-length 50
set -g status-left '' # Unset allow centred windows to align left
set -g window-status-format '#[fg=color7] #I#{?window_last_flag,##,:}#W '
set -g window-status-current-format '#[fg=color15 bold] #I#F#W #[default]'
setw -g window-status-separator ""
## RIGHT: Session
set -g status-right-length 100
set -g status-right '#[align=left]#[default]#{?#{==:#{client_key_table},root},,#[bg=color3 fg=color0 bold]#{client_key_table}#[default]}#[align=right] #{session_name} #[fg=color9]#(tmux ls | wc -l)#[default]#[default]#(timeout 0.1s git -C #{pane_current_path} rev-parse --is-inside-work-tree &>/dev/null && echo " on($(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD))")'

##### KEYS ####################################################################
# COPY MODE
bind v copy-mode
# bind v run-shell "tm-copy-mode"
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe 'wl-copy'
bind-key -T copy-mode-vi Y send -X copy-pipe-end-of-line 'wl-copy'
## Bind Prefix + / to enter copy mode and immediately prompt for a forward search string
bind / copy-mode \; send-keys / \; send-keys -X search-forward

# PANE/WINDOW NAVIGATION 
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R


# CUSTOM LAUNCHERS
## TMUX APPS IN SESSIONS
bind-key m run-shell "tmux #{@floatopts} -T ' #[fg=color4]Calculator ' -E 'tm-app-qalc \"#S\"'"
set-hook -g session-closed "run-shell 'tmux -L qalc_daemon kill-session -t qalc_#{session_name} 2>/dev/null || true'"
bind-key e run-shell "tmux #{@floatopts} -T ' #[fg=color4]Explorer ' -E 'tm-app-expl \"#S\"'"
set-hook -g session-closed "run-shell 'tmux -L expl_daemon kill-session -t expl_#{session_name} 2>/dev/null || true'"

## TMUX PICKERS/ LAUNCHERS
bind-key t run-shell "tmux #{@floatopts} -T ' #[fg=color4]Tests ' tm-open-tests"
bind-key o run-shell "tmux #{@floatopts} -T ' #[fg=color4]Open PDF ' tm-open-pdf"
bind-key q run-shell "tmux #{@floatopts} -T ' #[fg=color4]Questions ' nvim ~/documents/.questions.md"
bind-key g run-shell "tm-open-repoweb"
bind-key -r G display-popup -d "#{pane_current_path}" -w 100% -h 100% -T "#[fg=color4]lazygit" -E "lazygit" 

## TMUX SESSION NAVIGATION
bind-key s run-shell "tmux #{@floatopts} -T ' #[fg=color4]Sessions ' tm-sess-switch"
bind-key f run-shell "tmux #{@floatopts} -T ' #[fg=color4]New Session ' tm-sess-new" 
bind-key 0 run-shell "tm-sess-new ~ home"
bind c new-window -c "#{pane_current_path}"
bind C neww
bind tab last-window

set-hook -g client-session-changed 'run-shell "tmux refresh-client -S"'
set-hook -g session-created 'run-shell "tmux refresh-client -S"'
set-hook -g session-closed 'run-shell "tmux refresh-client -S"'
