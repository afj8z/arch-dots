##### Shell & Timing ###########################################################

set -g default-command /bin/zsh
set -s escape-time 0
set-option -g focus-events on

##### Prefix & Core Keys #######################################################

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind r source-file ~/.tmux.conf

##### Terminal & Features ######################################################

set -g default-terminal "screen-256color"
set-option -sa terminal-features 'tmux-256color:RGB'
set-option -g allow-passthrough on

##### Indexing & Session Behavior #############################################

set -g base-index 1
setw -g pane-base-index 1
set -g detach-on-destroy off
set-option -g renumber-windows on
setw -g automatic-rename on

##### Status Line ##############################################################
# set -g status-interval 1
set -g status-position top
set -g status-justify absolute-centre
set -g status-style 'fg=color15 bg=default'
set -g status-left '[#S]#(git -C #{pane_current_path} rev-parse --is-inside-work-tree &>/dev/null && echo "[on $(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD)$(git -C #{pane_current_path} describe --tags --abbrev=0 2>/dev/null | sed "s/^/ /")]")'
set -g status-left-style 'fg=color15'
set -g status-left-length 100
set -g status-right-length 100
set -g status-right '[#(tmux ls 2>/dev/null | wc -l | tr -d " \n")] [#(h=$(hostname); [ "$h" = "AfSurface" ] && echo usr || echo $h)]'
setw -g window-status-style 'fg=color8'
setw -g window-status-current-style 'bg=color250 fg=color0 bold'
setw -g window-status-format "#I:#{s_.*\\\\|\.exe__:pane_current_command}"
setw -g window-status-current-format ' #I:#W '

##### Mouse & Copy Mode ########################################################
# Enable mouse mode just in case
set -g mouse on

# Use vi key bindings in copy mode
setw -g mode-keys vi

# Copy-mode helpers
bind -r v copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe 'xclip -in -selection clipboard'
bind-key -T copy-mode-vi Y send -X copy-pipe-end-of-line 'xclip -in -selection clipboard'


##### Pane/Window Navigation ###################################################

bind -r ^ last-window
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

##### Popups ###################################################################

set -g popup-border-style "fg=color7 bg=default"

##### Custom Launchers #########################################################

bind-key -r f run-shell "tmux neww ~/.local/scripts/tm-sess"

bind-key -r o run-shell "tmux neww ~/.local/scripts/pdf-picker.sh"
bind-key -r D run-shell "~/.local/scripts/tm-sess ~/dev"
bind-key -r N run-shell "~/.local/scripts/tm-sess ~/documents"
bind-key -r C run-shell "~/.local/scripts/tm-sess ~/.config"
bind-key -r S run-shell "~/.local/scripts/tm-sess-pwd"
bind-key -r P run-shell -b "tmuxfzflaunch"
bind-key -r Q run-shell "tmux display-popup -E -w 80% -h 80% nvim ~/documents/.questions.md"
bind-key -r t run-shell "tmux display-popup -E -w 80% -h 80% nvim ~/documents/.todo.md"
bind-key -r . switch-client -l
