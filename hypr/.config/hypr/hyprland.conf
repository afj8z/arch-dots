### IMPORTS ###
source = ~/.config/theme/out/hypr.conf
### MONITORS ###
$intmon = eDP-1
$extmon = desc:AOC AG251FWG2 0x0000018F
monitor= $intmon, preferred,auto,auto
monitor= $extmon, 1920x1080,auto-up, 1

workspace = 1, monitor:$intmon
workspace = 2, monitor:$intmon
workspace = 3, monitor:$intmon
workspace = 4, monitor:$intmon
workspace = 5, monitor:$intmon
workspace = 6, monitor:$extmon
workspace = 7, monitor:$extmon
workspace = 8, monitor:$extmon
workspace = 9, monitor:$extmon
workspace = 0, monitor:$extmon
###################
### MY PROGRAMS ###
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun
#################
### AUTOSTART ###
exec-once = hypridle
exec-once = $terminal -e tmux
exec-once = cliphist wipe
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = hyprsunset
# exec-once = nm-applet &
exec-once = dunst
exec-once = waybar
exec-once = hyprpaper
exec-once = easyeffects -w
exec-once = dynamic-hyprborder
#############################
### ENVIRONMENT VARIABLES ###
env = HYPRCURSOR_THEME,rose-pine-hyprcursor
env = HYPRCURSOR_SIZE,38
###################
### PERMISSIONS ###
# ecosystem {
#   enforce_permissions = 1
# }
# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow
#####################
### LOOK AND FEEL ###
general {
    gaps_in = 3
    gaps_out = 3
    border_size = 2
    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 4
    rounding_power = 3
    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = false
        range = 4
        render_power = 2
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = false
        size = 5
        passes = 2
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)
	bezier = myBezier, 0.2, 0.6, 0.9, 1
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = easeOutExpo,0.16,1,0.3,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutExpo
    animation = windows, 1, 4.79, easeOutExpo
    animation = windowsIn, 1, 4.1, easeOutExpo, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 0.1, easeOutExpo
    animation = layersIn, 1, 0.1, easeOutExpo, popin
    animation = layersOut, 1, 0.1, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, myBezier, slide 50%
    animation = workspacesIn, 1, 1.5, myBezier, slide 100%
	animation = workspacesOut, 1, 1.5, myBezier, slide 100%
	}

# "Smart gaps" / "No gaps when only"
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mmod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
	vfr = true
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}
#############
### INPUT ###
input {
    kb_layout = us
    kb_options = compose:menu
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
		scroll_factor = 0.8
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
###################
### KEYBINDINGS ###
$mmod = SUPER
$smod = $mmod SHIFT
# Rofi System Control Menu
bind = $mmod, A, exec, rofi-system-menu
bind = $smod, P, exec, hyprlock
bind = $mmod, return, exec, $terminal
bind = $mmod, Q, killactive,
bind = $smod, C, exec, hyprpicker -a -f hex
bind = $smod, M, exit,
bind = $mmod, E, exec, $fileManager
bind = $mmod, space, exec, $HOME/.config/hypr/scripts/toggle-floatfix.sh
bind = $mmod, D, exec, $menu
bind = $smod, D, exec, rofi -config bar.rasi -show drun
bind = $mmod, T, togglesplit, # dwindle
bind = $mmod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mmod, F, fullscreen
bind = $mmod, O, exec, killall waybar && waybar & disown
bind = $mmod, G, exec, /usr/bin/firefoxpwa site launch 01K4FFEPD61W4RY26X8GQ5CETT 
# Move focus with mmod + arrow keys
bind = $mmod, h, movefocus, l
bind = $mmod, l, movefocus, r
bind = $mmod, k, movefocus, u
bind = $mmod, j, movefocus, d
bind = $smod, H, movewindow, l
bind = $smod, L, movewindow, r
bind = $smod, K, movewindow, u
bind = $smod, J, movewindow, d 
bind = $mmod, R, submap, resize

submap = resize

binde = , l, resizeactive, 50 0
binde = , h, resizeactive, -50 0
binde = , k, resizeactive, 0 -50
binde = , j, resizeactive, 0 50

bind = , catchall, submap, reset

submap = reset
# Switch workspaces with mmod + [0-9]
bind = $mmod, 1, workspace, 1
bind = $mmod, 2, workspace, 2
bind = $mmod, 3, workspace, 3
bind = $mmod, 4, workspace, 4
bind = $mmod, 5, workspace, 5
bind = $mmod, 6, workspace, 6
bind = $mmod, 7, workspace, 7
bind = $mmod, 8, workspace, 8
bind = $mmod, 9, workspace, 9
bind = $mmod, 0, workspace, 10

# Move active window to a workspace with mmod + SHIFT + [0-9]
bind = $smod, 1, movetoworkspace, 1
bind = $smod, 2, movetoworkspace, 2
bind = $smod, 3, movetoworkspace, 3
bind = $smod, 4, movetoworkspace, 4
bind = $smod, 5, movetoworkspace, 5
bind = $smod, 6, movetoworkspace, 6
bind = $smod, 7, movetoworkspace, 7
bind = $smod, 8, movetoworkspace, 8
bind = $smod, 9, movetoworkspace, 9
bind = $smod, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mmod, S, togglespecialworkspace, magic
bind = $smod, S, movetoworkspace, special:magic

# Move/resize windows with mmod + LMB/RMB and dragging
bindm = $mmod, mouse:272, movewindow
bindm = $mmod, mouse:273, resizewindow
# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, ~/.local/scripts/notify-med vol_up
bindel = ,XF86AudioLowerVolume, exec, ~/.local/scripts/notify-med vol_down
bindel = ,XF86AudioMute,        exec, ~/.local/scripts/notify-med vol_mute
bindel = ,XF86AudioMicMute,     exec, ~/.local/scripts/notify-med mic_mute
bindel = ,XF86MonBrightnessUp,   exec, ~/.local/scripts/notify-med bright_up
bindel = ,XF86MonBrightnessDown, exec, ~/.local/scripts/notify-med bright_down
bindel = $mmod, XF86MonBrightnessDown, exec, hyprctl hyprsunset temperature -400
bindel = $mmod, XF86MonBrightnessUp, exec, hyprctl hyprsunset temperature +400
# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
##############################
### WINDOWS AND WORKSPACES ###
# Ignore maximize requests from apps. You'll probably like this.
blurls = waybar
windowrule = suppressevent maximize, class:.*
windowrule = float, class:^(sys-dropdown)$
windowrule = size 60% 60%, class:^(sys-dropdown)$

workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = bordersize 0, onworkspace:w[tv1]
windowrule = rounding 0, onworkspace:w[tv1]
windowrule = bordersize 0, onworkspace:f[1]
windowrule = rounding 0, onworkspace:f[1]
layerrule = dimaround,rofi
